<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cantinho da Fofa</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #FFFDF0; /* Amarelo manteiga clarinho */
            --card-bg: #FEF9C3;  /* Amarelo manteiga mais forte */
            --text-main: #713F12; /* Marrom avelã aconchegante */
            --text-light: #A16207;
            --accent: #FDE047;
            --btn-hover: #FACC15;
            --white: #FFFFFF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Nunito', sans-serif;
            color: var(--text-main);
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            text-align: center;
            padding: 20px 15px;
            background-color: var(--card-bg);
            border-bottom: 3px solid var(--accent);
            box-shadow: 0 4px 15px rgba(253, 224, 71, 0.2);
            z-index: 10;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 800;
        }

        .content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            padding-bottom: 90px;
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.4s ease;
        }

        .tab-content.active {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100%;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- ABA RESPIRAR --- */
        .breath-container {
            position: relative;
            width: 220px;
            height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 40px;
        }

        .circle {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, var(--accent) 0%, var(--card-bg) 100%);
            box-shadow: 0 0 40px rgba(253, 224, 71, 0.4);
            transition: all linear;
        }

        .breath-text {
            position: relative;
            z-index: 2;
            font-size: 1.5rem;
            font-weight: 800;
            text-align: center;
            text-shadow: 1px 1px 3px rgba(255,255,255,0.8);
        }

        .breath-btn {
            margin-top: 50px;
            padding: 15px 40px;
            background-color: var(--card-bg);
            border: 2px solid var(--accent);
            border-radius: 30px;
            font-size: 1.2rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            transition: background 0.3s;
        }
        
        .breath-btn:hover { background-color: var(--accent); }

        /* --- ABA AMOR --- */
        .message-card {
            background-color: var(--white);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(253, 224, 71, 0.3);
            text-align: center;
            max-width: 90%;
            border: 2px dashed var(--accent);
        }

        .message-text {
            font-size: 1.3rem;
            line-height: 1.6;
            font-weight: 600;
            margin-bottom: 25px;
        }

        .love-btn {
            padding: 12px 30px;
            background-color: var(--accent);
            border: none;
            border-radius: 25px;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(253, 224, 71, 0.4);
        }

        /* --- ABA QUEBRA-CABEÇA --- */
        .photo-selector {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 10px;
            width: 100%;
            max-width: 350px;
            margin-bottom: 20px;
        }
        
        .photo-thumb {
            width: 60px;
            height: 60px;
            border-radius: 10px;
            object-fit: cover;
            border: 3px solid transparent;
            cursor: pointer;
            flex-shrink: 0;
            background-color: var(--card-bg);
        }
        
        .photo-thumb.active { border-color: var(--text-main); }

        #puzzle-container {
            width: 300px;
            height: 300px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 2px;
            background-color: var(--card-bg);
            border: 4px solid var(--accent);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .puzzle-piece {
            width: 100%;
            height: 100%;
            background-size: 300px 300px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .puzzle-piece.empty { background: none; cursor: default; }
        
        .win-message {
            margin-top: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #166534;
            display: none;
        }

        /* --- ABA ACALMAR --- */
        .grounding-box {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 15px;
            width: 100%;
            max-width: 350px;
            margin-bottom: 15px;
        }

        .grounding-title { font-size: 1.2rem; font-weight: 800; margin-bottom: 10px; }
        .grounding-desc { font-size: 1rem; margin-bottom: 15px; color: var(--text-light); }
        
        .check-item {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            font-size: 1.1rem;
            font-weight: 600;
        }

        .check-item input[type="checkbox"] {
            margin-right: 12px;
            width: 22px;
            height: 22px;
            accent-color: var(--text-main);
        }

        .hug-btn {
            width: 100%;
            padding: 15px;
            margin-top: 10px;
            background-color: var(--text-main);
            color: var(--bg-color);
            border: none;
            border-radius: 15px;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
        }

        /* --- NAVEGAÇÃO INFERIOR --- */
        nav {
            display: flex;
            justify-content: space-around;
            background-color: var(--white);
            padding: 15px 0;
            border-top: 2px solid var(--card-bg);
            position: fixed;
            bottom: 0;
            width: 100%;
            z-index: 10;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-light);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 800;
            cursor: pointer;
            transition: 0.2s;
        }

        .nav-item.active { color: var(--text-main); transform: scale(1.1); }
        .nav-icon { font-size: 1.5rem; margin-bottom: 4px; }
    </style>
</head>
<body>

    <header>
        <h1>Cantinho da Fofa 🌻</h1>
    </header>

        <!-- RESPIRAR -->
        <div id="tab-respirar" class="tab-content active">
            <div class="grounding-title" style="text-align:center; font-size: 1.4rem;">Respiração Guiada</div>
            <div class="grounding-desc" style="text-align:center;">Siga o círculo para acalmar o coração.</div>
            
            <div class="breath-container">
                <div class="circle" id="breath-circle" style="width: 100px; height: 100px;"></div>
                <div class="breath-text" id="breath-text">Pronta?</div>
            </div>
            
            <button class="breath-btn" id="start-breath" onclick="startBreathing()">Começar a respirar</button>
        </div>

            <div class="grounding-desc">Resolva o quebra-cabeça para ver a foto!</div>
