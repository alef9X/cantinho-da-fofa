<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cantinho da Fofa</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #FFFDF0; 
            --card-bg: #FEF9C3;  
            --text-main: #713F12; 
            --text-light: #A16207;
            --accent: #FDE047;
            --btn-hover: #FACC15;
            --white: #FFFFFF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Nunito', sans-serif;
            color: var(--text-main);
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* --- POP-UP DE ANIVERSÁRIO --- */
        .popup-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--bg-color);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn 0.8s ease;
        }

        .popup-card {
            background-color: var(--white);
            border: 3px dashed var(--accent);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(253, 224, 71, 0.4);
            max-height: 90vh;
            overflow-y: auto;
            max-width: 400px;
        }

        .carta-texto {
            font-size: 1.15rem;
            line-height: 1.6;
            font-weight: 600;
            text-align: left;
            margin-bottom: 25px;
            color: var(--text-main);
        }

        header {
            text-align: center;
            padding: 20px 15px;
            background-color: var(--card-bg);
            border-bottom: 3px solid var(--accent);
            box-shadow: 0 4px 15px rgba(253, 224, 71, 0.2);
            z-index: 10;
        }

        h1 { font-size: 1.8rem; font-weight: 800; }

        .content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            padding-bottom: 100px;
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.4s ease;
        }

        .tab-content.active {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100%;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- BOTOES --- */
        .action-btn {
            margin-top: 15px;
            padding: 15px 30px;
            background-color: var(--card-bg);
            border: 2px solid var(--accent);
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            transition: background 0.3s;
            width: 100%;
        }
        
        .action-btn:hover { background-color: var(--accent); }

        /* --- ABA RESPIRAR --- */
        .breath-container {
            position: relative;
            width: 220px;
            height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 40px;
        }

        .circle {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, var(--accent) 0%, var(--card-bg) 100%);
            box-shadow: 0 0 40px rgba(253, 224, 71, 0.4);
            transition: all linear;
        }

        .breath-text {
            position: relative;
            z-index: 2;
            font-size: 1.5rem;
            font-weight: 800;
            text-align: center;
            text-shadow: 1px 1px 3px rgba(255,255,255,0.8);
        }

        /* --- ABA AMOR --- */
        .message-card {
